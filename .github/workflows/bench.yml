name: Benchmarks

# Manual and weekly only. The benchmark tables in the README and docs quote
# one run of this workflow by run id (GitHub-hosted runner, node 24,
# BENCH_N=50 000, BENCH_ITERS=1 000 000). Runner noise is a few milliseconds at
# that record count, so ratios close to 1.0x should be read as level. The
# single-record hot loops (calibration, S9, S10) are sized by BENCH_ITERS, not by
# the record count: at 50 000 operations a round is 1 to 5 ms, where JIT state and
# scheduling noise dominate (#45), so the workflow sets it independently of
# BENCH_N. The workflow also proves the
# bench scripts still run after refactors. bench-v4 imports the built
# zod-cow-v4 package, so the build step runs before it; bench-v3 measures the
# zod3 line from source.
on:
  workflow_dispatch:
    inputs:
      bench_n:
        description: "Record count passed to the bench scripts as BENCH_N"
        required: false
        default: "50000"
        type: string
      bench_iters:
        description: "Operations per timed round of the single-record hot loops, passed as BENCH_ITERS"
        required: false
        default: "1000000"
        type: string
      node_version:
        description: "Node.js major to run on (24 is the README environment; 22 and 26 are the other CI lanes)"
        required: false
        default: "24"
        type: choice
        options: ["22", "24", "26"]
      bench_only:
        description: "Comma-separated scenario-id prefixes passed as BENCH_ONLY (e.g. S11); empty runs every scenario"
        required: false
        default: ""
        type: string
  schedule:
    # Mondays 03:17 UTC (off the hour to avoid the top-of-hour rush).
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  # Record count behind the published tables. The scripts default to 500 000
  # for local runs; 50 000 keeps a workflow run under a few minutes.
  BENCH_N: ${{ inputs.bench_n || '50000' }}
  # Operations per timed round of the hot loops. The scripts default to BENCH_N,
  # which at 50 000 gives 1 to 5 ms rounds on the nanosecond-scale loops;
  # 1 000 000 gives 20 to 250 ms. The loops that build detailed errors run a
  # tenth of it (ERROR_ITERS in the bench scripts), so their microsecond
  # operations give rounds in the same range instead of several seconds.
  BENCH_ITERS: ${{ inputs.bench_iters || '1000000' }}
  # Scenario filter for a re-measure of one change (#34): the bench scripts skip
  # every scenario whose id does not start with one of the prefixes. Empty on
  # the schedule, so the weekly run stays complete.
  BENCH_ONLY: ${{ inputs.bench_only || '' }}

jobs:
  bench:
    name: bench (node ${{ inputs.node_version || '24' }}, BENCH_N=${{ inputs.bench_n || '50000' }}, BENCH_ITERS=${{ inputs.bench_iters || '1000000' }}${{ inputs.bench_only && format(', BENCH_ONLY={0}', inputs.bench_only) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 24 = README benchmark environment; a dispatch may pick another CI
          # lane (22 / 26) to check a decision across the matrix (#34)
          node-version: ${{ inputs.node_version || '24' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build zod-cow-v4
        run: pnpm run build

      # Each bench step tees its output into a file so the summary step below
      # can render it even when a later step fails. `shell: bash` enables
      # pipefail, so a failing bench still fails the step through `tee`.
      # The package scripts already pass --expose-gc; BENCH_N and BENCH_ITERS
      # come from the job env.
      - name: Bench zod 4 (bench-v4, built package)
        shell: bash
        run: pnpm --filter bench-v4 run bench 2>&1 | tee bench-v4.txt

      - name: Bench zod 3 (bench-v3)
        if: ${{ !cancelled() }}
        shell: bash
        run: pnpm --filter bench-v3 run bench 2>&1 | tee bench-v3.txt

      - name: Write job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # Render one bench capture as a section: heading + fenced text block,
          # or a placeholder when the file is missing or empty.
          section() {
            local title="$1" file="$2"
            echo "### ${title}"
            echo
            if [ -s "${file}" ]; then
              echo '```text'
              cat "${file}"
              echo '```'
            else
              echo "_No output captured (step did not run or failed before printing)._"
            fi
            echo
          }
          {
            echo "## Benchmark run"
            echo
            echo "> Results from a GitHub-hosted runner (\`ubuntu-latest\`, node $(node --version), BENCH_N=${BENCH_N}, BENCH_ITERS=${BENCH_ITERS}${BENCH_ONLY:+, BENCH_ONLY=${BENCH_ONLY}})."
            echo "> The README and docs tables quote one run of this workflow by run id (node 24, BENCH_N=50000 for the batch scenarios, BENCH_ITERS=1000000 for the single-record hot loops)."
            if [ "${BENCH_N}" = "50000" ] && [ "${BENCH_ITERS}" = "1000000" ]; then
              echo "> This run uses the same configuration, so it can be compared against the cited run; runner noise is a few milliseconds at this record count.${BENCH_ONLY:+ Only the scenarios matching BENCH_ONLY=${BENCH_ONLY} ran.}"
            else
              echo "> This run uses BENCH_N=${BENCH_N} and BENCH_ITERS=${BENCH_ITERS}, so its numbers are not comparable with the cited run; it only checks that the bench scripts still work."
            fi
            echo
            section "zod 4 (bench-v4, built zod-cow-v4)" bench-v4.txt
            section "zod 3 (bench-v3)" bench-v3.txt
          } >> "$GITHUB_STEP_SUMMARY"
