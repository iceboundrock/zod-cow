name: Benchmarks

# Manual and weekly only. The benchmark tables in the README and docs quote
# one run of this workflow by run id (GitHub-hosted runner, node 24,
# BENCH_N=50 000). Runner noise is a few milliseconds at that record count, so
# ratios close to 1.0x should be read as level. The workflow also proves the
# bench scripts still run after refactors.
on:
  workflow_dispatch:
    inputs:
      bench_n:
        description: "Record count passed to the bench scripts as BENCH_N"
        required: false
        default: "50000"
        type: string
  schedule:
    # Mondays 03:17 UTC (off the hour to avoid the top-of-hour rush).
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  # Record count behind the published tables. The scripts default to 500 000
  # for local runs; 50 000 keeps a workflow run under a few minutes.
  BENCH_N: ${{ inputs.bench_n || '50000' }}

jobs:
  bench:
    name: bench (node 24, BENCH_N=${{ inputs.bench_n || '50000' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 24 = README benchmark environment
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each bench step tees its output into a file so the summary step below
      # can render it even when a later step fails. `shell: bash` enables
      # pipefail, so a failing bench still fails the step through `tee`.
      # The package.json scripts already pass --expose-gc; BENCH_N comes from
      # the job env.
      - name: Bench zod 4
        shell: bash
        run: pnpm run bench:z4 2>&1 | tee bench-z4.txt

      - name: Bench zod 3
        if: ${{ !cancelled() }}
        shell: bash
        run: pnpm run bench 2>&1 | tee bench-z3.txt

      - name: Write job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # Render one bench capture as a section: heading + fenced text block,
          # or a placeholder when the file is missing or empty.
          section() {
            local title="$1" file="$2"
            echo "### ${title}"
            echo
            if [ -s "${file}" ]; then
              echo '```text'
              cat "${file}"
              echo '```'
            else
              echo "_No output captured (step did not run or failed before printing)._"
            fi
            echo
          }
          {
            echo "## Benchmark run"
            echo
            echo "> Results from a GitHub-hosted runner (\`ubuntu-latest\`, node $(node --version), BENCH_N=${BENCH_N})."
            echo "> The README and docs tables quote one run of this workflow by run id (node 24, BENCH_N=50000)."
            if [ "${BENCH_N}" = "50000" ]; then
              echo "> This run uses the same configuration, so it can be compared against the cited run; runner noise is a few milliseconds at this record count."
            else
              echo "> This run uses BENCH_N=${BENCH_N}, so its numbers are not comparable with the cited run; it only checks that the bench scripts still work."
            fi
            echo
            section "zod 4 (bench:z4)" bench-z4.txt
            section "zod 3 (bench)" bench-z3.txt
          } >> "$GITHUB_STEP_SUMMARY"
